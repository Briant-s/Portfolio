<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script type="text/javascript">
      // Single-Page-App fallback for GitHub Pages.
      // GitHub Pages serves this file for any unknown path (e.g. a deep link
      // like /<repo>/projects/project-one on refresh). We encode the path into
      // a query string and redirect to the app root, where a matching snippet
      // in index.html restores the real URL before React Router boots.
      //
      // pathSegmentsToKeep:
      //   1 → GitHub Pages PROJECT site served from /<repo>/  (default here)
      //   0 → user/org site (username.github.io) or a custom domain at root
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
